[package]
name = "valco-weave"
version = "0.5.0"
description = "Valco Weave — an open-source visual web editor in the spirit of Dreamweaver"
authors = ["ItsRaiden"]
license = "MIT"
edition = "2021"

[lib]
name = "valco_weave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
suppaftp = { version = "13", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
