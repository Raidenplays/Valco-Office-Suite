// ValcoNet bootstrap - this first line is skipped by Gecko's autoconfig reader.
try {
  const manifest = Services.dirsvc.get("GreD", Ci.nsIFile);
  manifest.append("valconet");
  manifest.append("chrome.manifest");
  if (manifest.exists()) {
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
    ChromeUtils.importESModule("resource://valconet/ValcoNet.sys.mjs").ValcoNet.startup();
  }
} catch (ex) {
  Cu.reportError(ex);
}
